name: Build Android APK (WiFi Collector)

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type (release or debug)'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug

jobs:
  build:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Setup Java Development Kit (JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Grant Execute Permission to Gradlew
        run: chmod +x ./android/gradlew

      - name: Prepare Keystore (If Configured)
        id: prepare_keystore
        if: "${{ secrets.KEYSTORE_BASE64 != '' }}"
        run: |
          echo "Decoding release keystore from secrets..."
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > "$GITHUB_WORKSPACE/android/app/release.keystore"
          echo "keystore_ready=true" >> $GITHUB_OUTPUT

      - name: Build Release APK (Signed)
        if: "${{ steps.prepare_keystore.outputs.keystore_ready == 'true' && (github.event.inputs.build_type == 'release' || github.event_name == 'push') }}"
        env:
          KEYSTORE_FILE: "${{ github.workspace }}/android/app/release.keystore"
          KEYSTORE_PASSWORD: "${{ secrets.KEYSTORE_PASSWORD }}"
          KEY_ALIAS: "${{ secrets.KEY_ALIAS }}"
          KEY_PASSWORD: "${{ secrets.KEY_PASSWORD }}"
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Build APK (Debug / Fallback)
        if: "${{ steps.prepare_keystore.outputs.keystore_ready != 'true' || github.event.inputs.build_type == 'debug' }}"
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Find and Organize Generated APK
        id: organize_apk
        run: |
          mkdir -p output-apk
          if compgen -G "android/app/build/outputs/apk/release/*.apk" > /dev/null; then
            cp android/app/build/outputs/apk/release/*.apk output-apk/WiFi-Collector-Release.apk
            echo "apk_path=output-apk/WiFi-Collector-Release.apk" >> $GITHUB_OUTPUT
            echo "apk_name=WiFi-Collector-Release.apk" >> $GITHUB_OUTPUT
          elif compgen -G "android/app/build/outputs/apk/debug/*.apk" > /dev/null; then
            cp android/app/build/outputs/apk/debug/*.apk output-apk/WiFi-Collector-Debug.apk
            echo "apk_path=output-apk/WiFi-Collector-Debug.apk" >> $GITHUB_OUTPUT
            echo "apk_name=WiFi-Collector-Debug.apk" >> $GITHUB_OUTPUT
          fi

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.organize_apk.outputs.apk_name || 'WiFi-Collector-APK' }}
          path: ${{ steps.organize_apk.outputs.apk_path || 'android/app/build/outputs/apk/**/*.apk' }}
          retention-days: 30

      - name: Create GitHub Release (On Tag Push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.organize_apk.outputs.apk_path }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
